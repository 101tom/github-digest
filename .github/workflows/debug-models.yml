name: debug-models

on:
  workflow_dispatch: {}

permissions:
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测外网连通性
        run: |
          probe() {
            echo "======== $1 ========"
            code=$(curl -sS -o /tmp/o.txt -w "%{http_code}" -m 20 "$1" 2>/tmp/err.txt) || true
            echo "http_code=$code  bytes=$(wc -c </tmp/o.txt 2>/dev/null || echo 0)"
            head -c 200 /tmp/o.txt 2>/dev/null
            echo
            if [ -s /tmp/err.txt ]; then echo "stderr: $(head -c 200 /tmp/err.txt)"; fi
            echo
          }
          probe https://example.com
          probe https://api.github.com/zen
          probe https://raw.githubusercontent.com/github/gitignore/main/Python.gitignore
          probe https://api.openai.com/v1/models
          probe https://api.deepseek.com/v1/models
          probe https://models.github.ai/catalog/models
          probe https://www.google.com
